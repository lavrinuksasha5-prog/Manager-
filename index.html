<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TWKS - Telegram Session Manager</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --panel-bg: #121824;
            --border-color: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --success: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { font-size: 24px; margin-bottom: 20px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; }
        .card h2 { font-size: 16px; margin-bottom: 12px; color: var(--text-muted); font-weight: 500; }
        textarea { width: 100%; height: 100px; background: #080b10; border: 1px solid var(--border-color); border-radius: 8px; color: #fff; padding: 10px; resize: none; font-size: 13px; margin-bottom: 10px; }
        input[type="file"] { display: none; }
        .file-upload { border: 2px dashed var(--border-color); border-radius: 8px; padding: 30px; text-align: center; cursor: pointer; transition: 0.2s; background: #080b10; }
        .file-upload:hover { border-color: var(--accent); }
        button { background: var(--accent); color: #white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        button:hover { background: var(--accent-hover); }
        .table-container { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        th, td { padding: 12px 16px; border-bottom: 1px solid var(--border-color); }
        th { background: #0f1520; color: var(--text-muted); font-weight: 500; }
        tr:hover { background: rgba(255,255,255,0.01); }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; display: inline-block; }
        .badge-valid { background: rgba(34,197,94,0.1); color: var(--success); }
        .badge-error { background: rgba(239,68,68,0.1); color: var(--danger); }
        .badge-prem { background: rgba(234,179,8,0.1); color: #eab308; }
        .actions { display: flex; gap: 8px; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-danger { background: rgba(239,68,68,0.2); color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: #fff; }
        .avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TWKS Panel — Параллельные сессии & Безопасность</h1>
        
        <div class="grid">
            <div class="card">
                <h2>Загрузка прокси (формат: ip:port:user:pass или ip:port)</h2>
                <textarea id="proxyInput" placeholder="Вставьте прокси по одному на строку..."></textarea>
                <button onclick="uploadProxies()">Загрузить прокси</button>
            </div>
            
            <div class="card">
                <h2>Загрузка архива с tdata (ZIP)</h2>
                <label class="file-upload" id="dropZone">
                    <span id="uploadText">📁 Нажмите или перетащите ZIP с tdata сюда</span>
                    <input type="file" id="zipFile" accept=".zip" onchange="uploadZip()">
                </label>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Аватар</th>
                        <th>Телефон / User ID</th>
                        <th>Имя / Username</th>
                        <th>Устройство (Фингерпринт)</th>
                        <th>Прокси / IP</th>
                        <th>Пинг</th>
                        <th>Премиум</th>
                        <th>Статус</th>
                        <th>Дата создания</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="accountsTable">
                    <tr><td colspan="10" style="text-align: center; color: var(--text-muted);">Загрузка аккаунтов...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadAccounts() {
            try {
                const res = await fetch('/accounts');
                const data = await res.json();
                const tbody = document.getElementById('accountsTable');
                
                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="10" style="text-align: center; color: var(--text-muted);">Нет добавленных аккаунтов</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.map(acc => `
                    <tr>
                        <td>${acc.avatar_url ? `<img src="${acc.avatar_url}" class="avatar">` : '👤'}</td>
                        <td><strong>${acc.phone || 'N/A'}</strong><br><span style="color:var(--text-muted);font-size:11px">${acc.user_id || ''}</span></td>
                        <td>${acc.first_name || ''}<br><span style="color:var(--text-muted);font-size:11px">@${acc.username || 'none'}</span></td>
                        <td><code>${acc.device || 'N/A'}</code></td>
                        <td>${acc.proxy || 'N/A'}<br><span style="color:var(--text-muted);font-size:11px">${acc.ip || ''} (${acc.country || ''})</span></td>
                        <td>${acc.ping} ms</td>
                        <td>${acc.premium ? '<span class="badge badge-prem">⭐ Премиум</span>' : 'Нет'}</td>
                        <td>
                            ${acc.status === 'valid' ? '<span class="badge badge-valid">Активна</span>' : `<span class="badge badge-error" title="${acc.error_msg || ''}">Ошибка</span>`}
                        </td>
                        <td>${acc.created_at || ''}</td>
                        <td>
                            <div class="actions">
                                ${acc.status === 'valid' ? `<a href="/download/${acc.id}"><button class="btn-sm">💾 .session</button></a>` : ''}
                                <button class="btn-sm btn-danger" onclick="deleteAccount('${acc.id}')">Удалить</button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        async function uploadProxies() {
            const text = document.getElementById('proxyInput').value;
            if (!text.trim()) return alert('Введите прокси!');
            const res = await fetch('/proxies-text', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({text})
            });
            const data = await res.json();
            alert(`Успешно добавлено прокси: ${data.added}`);
            document.getElementById('proxyInput').value = '';
        }

        async function uploadZip() {
            const fileInput = document.getElementById('zipFile');
            if (!fileInput.files[0]) return;
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            
            document.getElementById('uploadText').innerText = '⏳ Создание параллельных сессий и валидация...';
            
            await fetch('/upload', { method: 'POST', body: formData });
            alert('Архив принят в работу! Сессии создаются в фоновом режиме. Обновите таблицу через минуту.');
            document.getElementById('uploadText').innerText = '📁 Нажмите или перетащите ZIP с tdata сюда';
            fileInput.value = '';
            setTimeout(loadAccounts, 3000);
        }

        async function deleteAccount(id) {
            if (!confirm('Удалить аккаунт и файл сессии?')) return;
            await fetch(`/accounts/${id}`, { method: 'DELETE' });
            loadAccounts();
        }

        setInterval(loadAccounts, 5000);
        loadAccounts();
    </script>
</body>
</html>
