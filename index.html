<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TWKS - Session Manager</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --panel-bg: #121824;
            --border-color: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --success: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 12px; }
        .container { width: 100%; max-width: 1400px; margin: 0 auto; }
        h1 { font-size: 18px; margin-bottom: 12px; font-weight: 600; }
        .grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; }
        .card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; }
        .card h2 { font-size: 14px; margin-bottom: 8px; color: var(--text-muted); font-weight: 500; }
        textarea { width: 100%; height: 80px; background: #080b10; border: 1px solid var(--border-color); border-radius: 8px; color: #fff; padding: 10px; resize: none; font-size: 13px; margin-bottom: 8px; }
        input[type="file"] { display: none; }
        .file-upload { border: 2px dashed var(--border-color); border-radius: 8px; padding: 15px; text-align: center; cursor: pointer; background: #080b10; display: block; margin-bottom: 8px; }
        button { background: var(--accent); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 500; cursor: pointer; width: 100%; font-size: 14px; }
        button:hover { background: var(--accent-hover); }
        .table-container { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 12px; min-width: 750px; }
        th, td { padding: 10px 12px; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
        th { background: #0f1520; color: var(--text-muted); font-weight: 500; }
        .badge { padding: 3px 6px; border-radius: 6px; font-size: 10px; font-weight: 500; display: inline-block; }
        .badge-valid { background: rgba(34,197,94,0.1); color: var(--success); }
        .badge-error { background: rgba(239,68,68,0.1); color: var(--danger); }
        .badge-prem { background: rgba(234,179,8,0.1); color: #eab308; }
        .actions { display: flex; gap: 6px; align-items: center; }
        .btn-sm { padding: 6px 10px; font-size: 11px; width: auto; }
        .btn-danger { background: rgba(239,68,68,0.2); color: var(--danger); }
        .avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TWKS Panel — Управление сессиями</h1>
        
        <div class="grid">
            <div class="card">
                <h2>1. Загрузка прокси (ip:port:user:pass)</h2>
                <textarea id="proxyInput" placeholder="Вставляй прокси сюда..."></textarea>
                <button onclick="uploadProxies()">Загрузить прокси в базу</button>
            </div>
            
            <div class="card">
                <h2>2. Загрузка файла сессии (.session)</h2>
                <label class="file-upload">
                    <span id="uploadText" style="font-size: 13px; color: var(--text-muted);">📁 Выбрать файл .session</span>
                    <input type="file" id="sessionFile" accept=".session" onchange="uploadSession()">
                </label>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Аватар</th>
                        <th>Телефон / ID</th>
                        <th>Имя / Username</th>
                        <th>Прокси / IP</th>
                        <th>Пинг</th>
                        <th>Премиум</th>
                        <th>Статус</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="accountsTable">
                    <tr><td colspan="8" style="text-align: center; color: var(--text-muted);">Загрузка сессий...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadAccounts() {
            try {
                const res = await fetch('/accounts');
                const data = await res.json();
                const tbody = document.getElementById('accountsTable');
                
                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--text-muted);">Сессии не добавлены</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.map(acc => `
                    <tr>
                        <td>${acc.avatar_url ? `<img src="${acc.avatar_url}" class="avatar">` : '👤'}</td>
                        <td><strong>${acc.phone || 'N/A'}</strong><br><span style="color:var(--text-muted);font-size:10px">${acc.user_id || ''}</span></td>
                        <td>${acc.first_name || ''}<br><span style="color:var(--text-muted);font-size:10px">@${acc.username || 'none'}</span></td>
                        <td>${acc.proxy || 'N/A'}<br><span style="color:var(--text-muted);font-size:10px">${acc.ip || ''} (${acc.country || ''})</span></td>
                        <td>${acc.ping} ms</td>
                        <td>${acc.premium ? '<span class="badge badge-prem">⭐ Премиум</span>' : 'Нет'}</td>
                        <td>
                            ${acc.status === 'valid' ? '<span class="badge badge-valid">Активна</span>' : `<span class="badge badge-error" onclick="alert('${acc.error_msg || ''}')">Ошибка 🔍</span>`}
                        </td>
                        <td>
                            <div class="actions">
                                ${acc.has_session ? `<a href="/download/${acc.id}"><button class="btn-sm">💾 .session</button></a>` : ''}
                                <button class="btn-sm btn-danger" onclick="deleteAccount('${acc.id}')">Удалить</button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (err) { console.error(err); }
        }

        async function uploadProxies() {
            const text = document.getElementById('proxyInput').value;
            if (!text.trim()) return alert('Пустое поле прокси!');
            const res = await fetch('/proxies-text', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({text})
            });
            const data = await res.json();
            alert(`Добавлено прокси: ${data.added}`);
            document.getElementById('proxyInput').value = '';
        }

        async function uploadSession() {
            const fileInput = document.getElementById('sessionFile');
            if (!fileInput.files[0]) return;
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            document.getElementById('uploadText').innerText = '⏳ Проверка сессии...';
            
            await fetch('/upload-session', { method: 'POST', body: formData });
            alert('Файл принят! Сессия проверяется через прокси.');
            setTimeout(loadAccounts, 3000);
            document.getElementById('uploadText').innerText = '📁 Выбрать файл .session';
            fileInput.value = '';
        }

        async function deleteAccount(id) {
            if (!confirm('Удалить сессию?')) return;
            await fetch(`/accounts/${id}`, { method: 'DELETE' });
            loadAccounts();
        }

        setInterval(loadAccounts, 6000);
        loadAccounts();
    </script>
</body>
</html>
