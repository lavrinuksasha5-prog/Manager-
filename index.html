<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TWKS Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        /* Скрываем скроллбар для красоты */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="antialiased pb-20">

    <!-- Навбар -->
    <nav class="bg-slate-900 border-b border-slate-800 sticky top-0 z-20 px-4 py-3 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold shadow-blue-500/50 shadow-lg">T</div>
            <h1 class="text-lg font-semibold tracking-wide">Менеджер</h1>
        </div>
        <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-lg shadow-blue-600/20 active:scale-95 flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            Импорт
        </button>
    </nav>

    <!-- Основной контент -->
    <main class="max-w-md mx-auto mt-4 px-3 space-y-4">
        <div id="empty-state" class="text-center py-20 opacity-50">
            <svg class="w-16 h-16 mx-auto mb-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
            <p class="text-lg">Нет аккаунтов</p>
        </div>
        <div id="accounts-grid" class="space-y-4"></div>
    </main>

    <!-- Модалка импорта -->
    <div id="import-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-end sm:items-center justify-center z-50 transition-opacity">
        <div class="bg-slate-800 rounded-t-3xl sm:rounded-3xl w-full max-w-md p-6 shadow-2xl relative border border-slate-700 transform transition-transform translate-y-0">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-white">Импорт аккаунтов</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white bg-slate-700/50 p-2 rounded-full">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <!-- Шаг 1: Прокси -->
            <div class="mb-5">
                <label class="block text-sm font-medium text-slate-300 mb-2">1. Прокси (в строку)</label>
                <textarea id="proxy-textarea" rows="3" placeholder="http://user:pass@ip:port" class="block w-full text-sm p-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-none text-slate-200 placeholder-slate-600 transition"></textarea>
            </div>

            <!-- Шаг 2: TData -->
            <div class="mb-8">
                <label class="block text-sm font-medium text-slate-300 mb-2">2. ZIP с tdata</label>
                <div class="relative border-2 border-dashed border-slate-600 hover:border-blue-500 transition rounded-xl p-4 text-center cursor-pointer bg-slate-900/50">
                    <input type="file" id="zip-input" accept=".zip" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    <svg class="w-8 h-8 mx-auto mb-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    <p id="file-name" class="text-sm text-slate-400">Нажмите или перетащите ZIP</p>
                </div>
            </div>

            <button onclick="startImport()" id="import-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-blue-600/30 flex justify-center items-center gap-2 active:scale-95">
                <span id="btn-text">Проверить всё</span>
                <svg id="loader" class="animate-spin h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            </button>
        </div>
    </div>

    <script>
        const API_URL = '';

        function openModal() { document.getElementById('import-modal').classList.remove('hidden'); document.getElementById('import-modal').classList.add('flex'); }
        function closeModal() { document.getElementById('import-modal').classList.add('hidden'); document.getElementById('import-modal').classList.remove('flex'); }

        document.getElementById('zip-input').addEventListener('change', function(e) {
            const fileName = e.target.files[0]?.name || 'Нажмите или перетащите ZIP';
            document.getElementById('file-name').textContent = fileName;
            document.getElementById('file-name').classList.add('text-blue-400');
        });

        async function loadAccounts() {
            try {
                const res = await fetch(`${API_URL}/accounts`);
                const data = await res.json();
                renderAccounts(data);
            } catch (e) { console.error("Ошибка загрузки:", e); }
        }

        function getFlagEmoji(countryCode) {
            if (!countryCode) return '🏳️';
            const codePoints = countryCode.toUpperCase().split('').map(char => 127397 + char.charCodeAt(0));
            return String.fromCodePoint(...codePoints);
        }

        function renderAccounts(accounts) {
            const grid = document.getElementById('accounts-grid');
            const empty = document.getElementById('empty-state');
            
            if (!accounts || accounts.length === 0) {
                grid.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            grid.innerHTML = accounts.map(acc => {
                const isPremium = acc.premium ? '<span class="text-emerald-400 text-xs font-bold">Premium</span>' : '<span class="text-red-400 text-xs font-bold">Нет Premium</span>';
                const statusColor = acc.status === 'valid' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-red-500/10 text-red-400 border-red-500/20';
                const statusText = acc.status === 'valid' ? 'ONLINE' : 'ERROR';

                // Если ошибка, показываем плашку с текстом
                if (acc.status === 'error') {
                    return `
                    <div class="bg-slate-800 rounded-2xl p-4 shadow-lg border border-red-900/30">
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-slate-300 font-bold">?</div>
                                <div>
                                    <h3 class="font-bold text-white text-sm">Ошибка аккаунта</h3>
                                    <p class="text-xs text-slate-400">${acc.proxy}</p>
                                </div>
                            </div>
                            <span class="px-2 py-1 rounded-md text-[10px] font-bold border ${statusColor}">${statusText}</span>
                        </div>
                        <div class="bg-red-500/10 border border-red-500/20 rounded-lg p-2 text-xs text-red-400 mt-2">
                            ${acc.error_msg || 'Неизвестная ошибка'}
                        </div>
                        <button onclick="deleteAccount('${acc.id}')" class="mt-3 w-full bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs py-2 rounded-lg transition">Удалить</button>
                    </div>
                    `;
                }

                // Карточка живого аккаунта
                return `
                <div class="bg-slate-800 rounded-2xl p-4 shadow-lg border border-slate-700/50 relative overflow-hidden">
                    <!-- Верхняя часть -->
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-inner">
                                ${(acc.username || 'A')[0].toUpperCase()}
                            </div>
                            <div>
                                <h3 class="font-bold text-white text-base">${acc.username || 'Без юзернейма'}</h3>
                                <p class="text-sm text-slate-400">${acc.phone || 'Нет телефона'}</p>
                            </div>
                        </div>
                        <span class="px-2.5 py-1 rounded-md text-[10px] font-bold border ${statusColor}">${statusText}</span>
                    </div>

                    <!-- Инфо -->
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <div class="bg-slate-900/50 p-2 rounded-xl border border-slate-700/50">
                            <p class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold mb-1">Аккаунт</p>
                            <p class="text-xs text-slate-200 flex items-center gap-1">${getFlagEmoji(acc.country_code)} ${acc.country || 'Неизвестно'}</p>
                        </div>
                        <div class="bg-slate-900/50 p-2 rounded-xl border border-slate-700/50">
                            <p class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold mb-1">Прокси</p>
                            <p class="text-xs text-slate-200 flex items-center gap-1">${getFlagEmoji(acc.proxy_country)} ${acc.proxy_country || 'Локация'} <span class="text-amber-400">⚡${acc.ping || 0} ms</span></p>
                        </div>
                        <div class="bg-slate-900/50 p-2 rounded-xl border border-slate-700/50">
                            <p class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold mb-1">Premium</p>
                            <p class="text-xs">${isPremium}</p>
                        </div>
                        <div class="bg-slate-900/50 p-2 rounded-xl border border-slate-700/50">
                            <p class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold mb-1">IP</p>
                            <p class="text-xs text-slate-200 font-mono">${acc.ip || '---.---.---.---'}</p>
                        </div>
                    </div>

                    <!-- Прокси строка -->
                    <div class="bg-slate-900/80 rounded-lg p-2 mb-4 flex items-center justify-between border border-slate-700/50">
                        <p class="text-xs text-slate-400 truncate w-11/12">${acc.proxy}</p>
                        <svg class="w-4 h-4 text-slate-500 cursor-pointer hover:text-white" onclick="navigator.clipboard.writeText('${acc.proxy}')" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    </div>

                    <!-- Кнопки -->
                    <div class="flex gap-2">
                        <button class="flex-1 bg-emerald-500 hover:bg-emerald-400 text-white text-xs font-bold py-2.5 rounded-xl transition shadow-lg shadow-emerald-500/20 active:scale-95 flex items-center justify-center gap-1">
                            💎 Купить
                        </button>
                        <button class="flex-1 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-2.5 rounded-xl transition shadow-lg shadow-blue-600/20 active:scale-95 flex items-center justify-center gap-1">
                            📱 Открыть
                        </button>
                        <button class="w-12 bg-amber-500 hover:bg-amber-400 text-white rounded-xl transition active:scale-95 flex items-center justify-center" onclick="deleteAccount('${acc.id}')">
                            🗑️
                        </button>
                    </div>
                    <div class="text-center mt-3">
                        <p class="text-[10px] text-slate-500 font-mono">FP: ${acc.device.toLowerCase().replace(' ', '_')}</p>
                    </div>
                </div>
                `;
            }).join('');
        }

        async function deleteAccount(id) {
            if (!confirm('Удалить аккаунт?')) return;
            await fetch(`${API_URL}/accounts/${id}`, { method: 'DELETE' });
            loadAccounts();
        }

        async function startImport() {
            const proxyText = document.getElementById('proxy-textarea').value.trim();
            const zipFile = document.getElementById('zip-input').files[0];
            
            if (!proxyText || !zipFile) {
                alert('Пожалуйста, вставьте прокси и выберите ZIP-архив');
                return;
            }

            const btn = document.getElementById('import-btn');
            const btnText = document.getElementById('btn-text');
            const loader = document.getElementById('loader');

            btn.disabled = true;
            btn.classList.add('opacity-75');
            btnText.innerText = 'Загрузка...';
            loader.classList.remove('hidden');

            try {
                await fetch(`${API_URL}/proxies-text`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: proxyText }) 
                });

                const zipData = new FormData();
                zipData.append('file', zipFile);
                await fetch(`${API_URL}/upload`, { method: 'POST', body: zipData });

                setTimeout(() => {
                    loadAccounts();
                    closeModal();
                    btn.disabled = false;
                    btn.classList.remove('opacity-75');
                    btnText.innerText = 'Проверить всё';
                    loader.classList.add('hidden');
                }, 5000);

            } catch (e) {
                alert('Ошибка: ' + e.message);
                btn.disabled = false;
                btn.classList.remove('opacity-75');
                btnText.innerText = 'Проверить всё';
                loader.classList.add('hidden');
            }
        }

        loadAccounts();
        setInterval(loadAccounts, 10000);
    </script>
</body>
</html>
