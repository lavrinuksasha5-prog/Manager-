<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TWKS - Session Manager</title>
    <style>
        :root { --bg-color: #0b0e14; --panel-bg: #121824; --border-color: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #3b82f6; --accent-hover: #2563eb; --danger: #ef4444; --success: #22c55e; --warning: #f59e0b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 12px; }
        .container { width: 100%; max-width: 1400px; margin: 0 auto; }
        h1 { font-size: 18px; margin-bottom: 12px; font-weight: 600; }
        .grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; }
        .card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; }
        .card h2 { font-size: 14px; margin-bottom: 8px; color: var(--text-muted); font-weight: 500; }
        textarea { width: 100%; height: 80px; background: #080b10; border: 1px solid var(--border-color); border-radius: 8px; color: #fff; padding: 10px; resize: none; font-size: 13px; margin-bottom: 8px; }
        input[type="file"] { display: none; }
        .file-upload { border: 2px dashed var(--border-color); border-radius: 8px; padding: 15px; text-align: center; cursor: pointer; background: #080b10; display: block; margin-bottom: 8px; }
        button { background: var(--accent); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 500; cursor: pointer; width: 100%; font-size: 14px; }
        button:hover { background: var(--accent-hover); }
        .table-container { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 12px; min-width: 900px; }
        th, td { padding: 10px 12px; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
        th { background: #0f1520; color: var(--text-muted); font-weight: 500; }
        .badge { padding: 3px 6px; border-radius: 6px; font-size: 10px; font-weight: 500; display: inline-block; }
        .badge-valid { background: rgba(34,197,94,0.1); color: var(--success); }
        .badge-error { background: rgba(239,68,68,0.1); color: var(--danger); cursor: pointer; }
        .actions { display: flex; gap: 6px; align-items: center; }
        .btn-sm { padding: 6px 10px; font-size: 11px; width: auto; }
        .btn-success { background: rgba(34,197,94,0.2); color: var(--success); }
        .btn-warning { background: rgba(245,158,11,0.2); color: var(--warning); }
        .btn-danger { background: rgba(239,68,68,0.2); color: var(--danger); }
        .avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
        
        /* Модалка */
        #browserModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:9999; flex-direction:column; }
        #browserModal .top-bar { padding:10px; background:#1e293b; text-align:right; display: flex; justify-content: space-between; align-items: center; }
        #browserModal .top-bar span { font-size: 14px; font-weight: 600; color: white; }
        #browserModal button { width: auto; background:#ef4444; padding: 8px 16px; }
        #browserScreen { width:100%; flex-grow:1; object-fit:contain; cursor:crosshair; background: #000; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TWKS Panel — Управление сессиями</h1>
        
        <div class="grid">
            <div class="card">
                <h2>1. Загрузка прокси (ip:port:user:pass)</h2>
                <textarea id="proxyInput" placeholder="socks5://user:pass@ip:port"></textarea>
                <button onclick="uploadProxies()">Загрузить прокси в базу</button>
            </div>
            
            <div class="card">
                <h2>2. Загрузка архива с сессиями (.zip)</h2>
                <label class="file-upload">
                    <span id="uploadText" style="font-size: 13px; color: var(--text-muted);">📁 Выбрать ZIP архив с папками аккаунтов</span>
                    <input type="file" id="sessionFile" accept=".zip" onchange="uploadSession()">
                </label>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Аватар</th>
                        <th>Телефон / ID</th>
                        <th>Имя / Username</th>
                        <th>Прокси / IP</th>
                        <th>Пинг</th>
                        <th>Статус</th>
                        <th>Управление сеансом</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="accountsTable">
                    <tr><td colspan="8" style="text-align: center; color: var(--text-muted);">Загрузка сессий...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Модалка -->
    <div id="browserModal">
        <div class="top-bar">
            <span>Удаленный браузер (Прокси активен)</span>
            <button onclick="closeBrowser()">Закрыть браузер</button>
        </div>
        <img id="browserScreen" onclick="handleScreenClick(event)">
    </div>

    <script>
        let currentBrowserId = null;
        let browserInterval = null;

        async function loadAccounts() {
            try {
                const res = await fetch('/accounts');
                const data = await res.json();
                const tbody = document.getElementById('accountsTable');
                
                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--text-muted);">Сессии не добавлены</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.map(acc => {
                    const safeError = (acc.error_msg || 'Неизвестная ошибка').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    return `
                    <tr>
                        <td>${acc.avatar_url ? `<img src="${acc.avatar_url}" class="avatar">` : '👤'}</td>
                        <td><strong>${acc.phone || 'N/A'}</strong><br><span style="color:var(--text-muted);font-size:10px">${acc.user_id || ''}</span></td>
                        <td>${acc.first_name || ''}<br><span style="color:var(--text-muted);font-size:10px">@${acc.username || 'none'}</span></td>
                        <td>${acc.proxy || 'N/A'}<br><span style="color:var(--text-muted);font-size:10px">${acc.ip || ''}</span></td>
                        <td>${acc.ping} ms</td>
                        <td>
                            ${acc.status === 'valid' ? '<span class="badge badge-valid">Активна</span>' : `<span class="badge badge-error" onclick="alert('${safeError}')">Ошибка 🔍</span>`}
                        </td>
                        <td>
                            <div class="actions">
                                ${acc.is_active_web 
                                    ? `<button class="btn-sm btn-warning" onclick="closeBrowser('${acc.id}')">🔴 Закрыть</button>`
                                    : `<button class="btn-sm btn-success" onclick="openBrowser('${acc.id}')">🟢 Открыть веб</button>`
                                }
                            </div>
                        </td>
                        <td>
                            <div class="actions">
                                ${acc.has_session ? `<a href="/download/${acc.id}"><button class="btn-sm">💾 .session</button></a>` : ''}
                                <button class="btn-sm btn-danger" onclick="deleteAccount('${acc.id}')">Удалить</button>
                            </div>
                        </td>
                    </tr>
                `;}).join('');
            } catch (err) { console.error(err); }
        }

        async function openBrowser(id) {
            const res = await fetch(`/auth/start_browser/${id}`, { method: 'POST' });
            const data = await res.json();
            if (data.status === 'ok') {
                currentBrowserId = id;
                document.getElementById('browserModal').style.display = 'flex';
                document.getElementById('browserScreen').src = `/auth/screenshot/${id}?t=${Date.now()}`;
                
                browserInterval = setInterval(() => {
                    document.getElementById('browserScreen').src = `/auth/screenshot/${id}?t=${Date.now()}`;
                }, 800);
            } else {
                alert(data.error || 'Ошибка запуска браузера');
            }
        }

        async function closeBrowser(id = null) {
            const targetId = id || currentBrowserId;
            if (!targetId) return;
            
            clearInterval(browserInterval);
            document.getElementById('browserModal').style.display = 'none';
            currentBrowserId = null;
            
            await fetch(`/auth/close_browser/${targetId}`, { method: 'POST' });
            loadAccounts();
        }

        async function handleScreenClick(e) {
            if (!currentBrowserId) return;
            const rect = e.target.getBoundingClientRect();
            const x = Math.round((e.clientX - rect.left) * (1024 / rect.width));
            const y = Math.round((e.clientY - rect.top) * (768 / rect.height));
            
            await fetch(`/auth/click/${currentBrowserId}?x=${x}&y=${y}`, { method: 'POST' });
        }

        async function uploadProxies() {
            const text = document.getElementById('proxyInput').value;
            if (!text.trim()) return alert('Пустое поле прокси!');
            const res = await fetch('/proxies-text', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({text})
            });
            const data = await res.json();
            alert(`Добавлено прокси: ${data.added}`);
            document.getElementById('proxyInput').value = '';
        }

        async function uploadSession() {
            const fileInput = document.getElementById('sessionFile');
            if (!fileInput.files[0]) return;
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            document.getElementById('uploadText').innerText = '⏳ Распаковка и проверка...';
            
            await fetch('/upload-session', { method: 'POST', body: formData });
            alert('ZIP архив принят! Сессии обрабатываются.');
            setTimeout(loadAccounts, 4000);
            document.getElementById('uploadText').innerText = '📁 Выбрать ZIP архив с папками аккаунтов';
            fileInput.value = '';
        }

        async function deleteAccount(id) {
            if (!confirm('Удалить сессию?')) return;
            await fetch(`/accounts/${id}`, { method: 'DELETE' });
            loadAccounts();
        }

        setInterval(loadAccounts, 6000);
        loadAccounts();
    </script>
</body>
</html>
