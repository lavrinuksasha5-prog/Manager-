<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TWKS Manager</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #131823;
            --border-color: #1e2636;
            --accent-color: #3b82f6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #10b981;
            --error: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; background: var(--card-bg); padding: 16px 20px; border-radius: 12px; border: 1px solid var(--border-color); }
        .logo { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 18px; }
        .logo-icon { background: var(--accent-color); color: white; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
        .btn { background: var(--accent-color); color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-block; text-align: center; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-danger { background: var(--error); }
        .btn-secondary { background: #374151; }
        
        .accounts-list { display: flex; flex-direction: column; gap: 16px; }
        .account-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .acc-header { display: flex; justify-content: space-between; align-items: center; }
        .acc-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: #374151; }
        .acc-name { font-weight: 600; font-size: 16px; }
        .acc-username { color: var(--text-muted); font-size: 13px; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .badge-online { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .badge-error { background: rgba(239, 68, 68, 0.15); color: var(--error); }
        
        .acc-details { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; font-size: 12px; }
        .detail-item label { color: var(--text-muted); display: block; margin-bottom: 2px; }
        .detail-item val { font-weight: 600; }
        
        .acc-footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .proxy-info { color: var(--text-muted); font-size: 13px; }
        .acc-actions { display: flex; gap: 8px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border-color); padding: 24px; border-radius: 12px; width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 16px; }
        .modal-content h3 { font-size: 18px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 13px; color: var(--text-muted); }
        .form-control { background: var(--bg-color); border: 1px solid var(--border-color); color: white; padding: 10px; border-radius: 8px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">T</div>
                <span>Менеджер</span>
            </div>
            <button class="btn" onclick="openImportModal()">+ Импорт</button>
        </header>

        <div class="accounts-list" id="accountsList"></div>
    </div>

    <!-- Модалка импорта -->
    <div class="modal" id="importModal">
        <div class="modal-content">
            <h3>Импорт прокси и tdata</h3>
            <div class="form-group">
                <label>Прокси (HTTP формат user:pass@host:port)</label>
                <textarea class="form-control" id="proxyInput" rows="4" placeholder="Вставьте прокси..."></textarea>
            </div>
            <div class="form-group">
                <label>ZIP архив с tdata</label>
                <input type="file" class="form-control" id="zipInput" accept=".zip">
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px;">
                <button class="btn btn-secondary" onclick="closeImportModal()">Отмена</button>
                <button class="btn" onclick="submitImport()">Загрузить</button>
            </div>
        </div>
    </div>

    <script>
        async function loadAccounts() {
            try {
                const res = await fetch('/accounts');
                const accounts = await res.json();
                const list = document.getElementById('accountsList');
                list.innerHTML = '';

                if (accounts.length === 0) {
                    list.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 40px;">Нет добавленных аккаунтов</div>';
                    return;
                }

                accounts.forEach(acc => {
                    const card = document.createElement('div');
                    card.className = 'account-card';
                    card.innerHTML = `
                        <div class="acc-header">
                            <div class="acc-info">
                                <img src="${acc.avatar_url || 'https://via.placeholder.com/44'}" class="avatar" alt="">
                                <div>
                                    <div class="acc-name">${acc.first_name || 'Аккаунт'}</div>
                                    <div class="acc-username">@${acc.username || 'no_username'}</div>
                                </div>
                            </div>
                            <span class="badge ${acc.status === 'valid' ? 'badge-online' : 'badge-error'}">${acc.status === 'valid' ? 'ONLINE' : 'ERROR'}</span>
                        </div>
                        <div class="acc-details">
                            <div class="detail-item"><label>Страна</label><val>${acc.country || 'Неизвестно'}</val></div>
                            <div class="detail-item"><label>IP</label><val>${acc.ip || 'N/A'}</val></div>
                            <div class="detail-item"><label>Пинг</label><val>${acc.ping}ms</val></div>
                            <div class="detail-item"><label>Premium</label><val>${acc.premium ? 'Да' : 'Нет'}</val></div>
                        </div>
                        <div class="acc-footer">
                            <div class="proxy-info">${acc.proxy || 'Нет прокси'}</div>
                            <div class="acc-actions">
                                <a href="/tg/k/${acc.id}" target="_blank" class="btn">Купить</a>
                                <button class="btn btn-danger" onclick="deleteAccount('${acc.id}')">Удалить</button>
                            </div>
                        </div>
                    `;
                    list.appendChild(card);
                });
            } catch (e) {
                console.error("Ошибка загрузки", e);
            }
        }

        function openImportModal() { document.getElementById('importModal').style.display = 'flex'; }
        function closeImportModal() { document.getElementById('importModal').style.display = 'none'; }

        async function submitImport() {
            const proxyText = document.getElementById('proxyInput'].value;
            const zipFile = document.getElementById('zipInput'].files[0];

            if (proxyText) {
                await fetch('/proxies-text', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({text: proxyText})
                });
            }
            if (zipFile) {
                const formData = new FormData();
                formData.append('file', zipFile);
                await fetch('/upload', { method: 'POST', body: formData });
            }

            closeImportModal();
            setTimeout(loadAccounts, 2000);
        }

        async function deleteAccount(accId) {
            if (confirm('Удалить аккаунт?')) {
                await fetch(`/accounts/${accId}`, { method: 'DELETE' });
                loadAccounts();
            }
        }

        loadAccounts();
        setInterval(loadAccounts, 5000);
    </script>
</body>
</html>
